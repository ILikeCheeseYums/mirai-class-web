<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <style>
      body{
        padding: 15rem;
      }
      .contain{
        border: solid black 3px;
        height: 300px;
        width: 400px;
        margin: auto;
        display: flex;
        padding: 2rem;
        gap: 1rem;
        justify-content: space-between;
      }
      .contain div{
        height: 50px;
        width: 50px;
        display: flex;
        border: solid black 3px;
        justify-content: center;
        align-items: center;
      }
  </style>
</head>
<body>
  <div class="contain">
    <div><p>A</p></div>
    <div><p>B</p></div>
    <div><p>C</p></div>
  </div>
</body>
</html>
