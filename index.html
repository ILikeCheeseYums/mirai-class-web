<html lang="en">
<head>

  <link rel="stylesheet" href="style.css">
  <style>
    body{

}
.d1{

}

  border-radius: 1rem;
  padding: 2rem; 
  position: absolute;
  bottom: 0;
  left: 0;
  height: 50%;
  width: 50%;
}
  </style>
</head>
<body>
  <div class="d1">
    <p>D1</p>
    <div class="d2">
      <p>D2</p>
    </div>
